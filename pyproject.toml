[project]
name = "agentkit"
version = "0.1.0"
description = "Shared primitives of the owner's agents: secret masking, safe file primitives, HTTP client, read-only SQLite, MCP server skeleton"
requires-python = ">=3.9"
# The core is stdlib only: a host script on /usr/bin/python3 and dev's box take a vendored copy of it.
dependencies = []

[project.optional-dependencies]
# The MCP server skeleton (agentkit.mcp) alone needs it; mcp itself needs Python 3.10.
mcp = ["mcp>=1.27,<2 ; python_version >= '3.10'"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "agentkit[mcp]"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Starlette's TestClient nags about httpx2; that is upstream's migration, not a defect here.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 120
# py39 for the stdlib modules: their vendored copies run on the host's /usr/bin/python3.
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "B", "SIM", "UP"]
